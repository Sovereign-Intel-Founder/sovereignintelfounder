name: SIP Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build and Test C Core (ASan + UBSan)
        run: |
          cd core
          make clean
          make all
          make test
          make sanitize

      - name: Execute Python Unit Test Suites
        run: |
          cd core
          python3 -m unittest discover -s arbitrage/tests -v
          python3 -m unittest discover -s sip_depot/tests -v

      - name: Strict shell=True Security Guardrail
        run: |
          ! grep -rn "shell=True" core/ --exclude-dir=tests

      - name: Wildcard Socket Binding Guardrail
        run: |
          ! grep -rn "0.0.0.0" core/ --exclude-dir=tests --exclude="*.md"

      - name: Rust Verifier Compilation and Tests
        run: |
          if [ -d "core/sip-verifier" ]; then
            cd core/sip-verifier
            cargo check --verbose
            cargo test --verbose
          else
            echo "::notice::core/sip-verifier directory pending integration"
          fi

      - name: Kinetic Capsule Verification
        run: |
          if [ -f "tools/verify_capsule.py" ]; then
            python3 tools/verify_capsule.py
          else
            echo "::notice::Kinetic Capsule runner pending integration"
          fi
