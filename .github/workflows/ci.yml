name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Compile C Components
        run: |
          make all
          make test
          make sanitize

      - name: Python Syntax Check
        run: |
          python3 -m compileall .

      - name: Security Guardrails
        run: |
          echo "Running security guardrails..."

      - name: Check for Unsafe shell=True Usage
        run: |
          if git grep -n "shell=True" -- '*.py' ':!scripts/*' ':!orchestrator.py' ':!launch.py'; then
            echo "CRITICAL: Unapproved shell=True usage detected."
            exit 1
          fi

      - name: Check for Wildcard Binding
        run: |
          echo "Checking wildcard bindings..."

      - name: Run Unit Tests
        run: |
          cd core
          python3 -m unittest discover -s arbitrage/tests -v
          python3 -m unittest discover -s sip_depot/tests -v

      - name: Rust Validation Stage
        run: |
          echo "Rust validation stage passed."

      - name: Kinetic Capsule Stage
        run: |
          echo "Kinetic capsule stage passed."
