name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y build-essential gcc make

      - name: Compile C Components
        run: make all

      - name: Verify Python Syntax
        run: python3 -m compileall -q .

      - name: Install dependencies
        run: pip install cryptography


      - name: Run Unit Tests
        run: |
          cd core && python3 -m unittest discover -s arbitrage/tests -v
          python3 -m unittest discover -s sip_depot/tests -v
          python3 -m unittest discover -s sip-remote-handoff -p 'test_*.py' -v

      - name: Run Rust Tests & Conformance
        run: |
          cargo fmt --manifest-path sip-verifier/Cargo.toml -- --check
          cargo check --manifest-path sip-verifier/Cargo.toml
          cargo test --manifest-path sip-verifier/Cargo.toml

      - name: Run Kinetic Capsule Demos & Tests
        run: |
          python3 kinetic_capsule_poc/demo.py
          python3 -m kinetic_capsule_poc_v2.demo_controller
          python3 kinetic_capsule_conformance/independent_verifier.py kinetic_capsule_conformance/fixtures

  security-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Wildcard Bindings in Core Paths
        run: |
          if git grep -nE "0\.0\.0\.0" tollbridge_system/ sip_core/ mesh/; then
            echo "CRITICAL: Wildcard 0.0.0.0 binding detected in core modules."
            exit 1
          fi
          echo "Security check passed: No unapproved wildcard bindings."

      - name: Check for Unsafe shell=True Usage
        run: |
          if git grep -n "shell=True" -- '*.py' ':!scripts/*' ':!orchestrator.py' ':!launcher.py' ':!daemon.py' ':!tollbridge_system/*' ':!solana-ledger/*' ; then
            echo "CRITICAL: Unapproved shell=True usage detected."
            exit 1
          fi
          echo "Security guardrail passed: All modules comply with hardening policy."
