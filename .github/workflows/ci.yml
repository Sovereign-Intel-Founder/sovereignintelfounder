name: SIP Engineering CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build C Primitives (Strict)
        run: |
          make all

      - name: Verify Python Compilation
        run: |
          python3 -m compileall -q .

      - name: Run Arbitrage Unit Tests
        run: |
          PYTHONPATH=. python3 -m unittest discover -s arbitrage/tests -v

      - name: Run SIP Depot Unit Tests
        run: |
          PYTHONPATH=. python3 -m unittest discover -s sip_depot/tests -v

      - name: Static Security Analysis (Advisory Bandit Scan)
        run: |
          pip install bandit
          bandit -r . -ll -ii --exclude ./venv,.git

      - name: Validate JSON Artifacts
        run: |
          python3 -c '
          import json, glob
          for path in glob.glob("**/*.json", recursive=True):
              if "venv" in path or ".git" in path:
                  continue
              with open(path, "r") as f:
                  json.load(f)
              print(f"Valid JSON: {path}")
          '
