name: Sovereign Intelligence Protocol CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install aiohttp requests

    - name: Verify Code Syntax
      run: |
        python -m py_compile toll_bridge_daemon.py
        python -m py_compile stress_test.py

    - name: SQLite WAL Integrity Check
      run: |
        mkdir -p toll_gate
        sqlite3 toll_gate/sip_ledger.db "PRAGMA journal_mode=WAL; PRAGMA integrity_check;"
