name: SIP Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .

      - name: Ensure Key Material Exists
        run: python3 scripts/init_keys.py

      - name: Run Phase 1 Telemetry (Identity & Crypto)
        run: python3 adapters/sovereign_adapter_phase1.py

      - name: Run Phase 2 Telemetry (Residency & Sovereignty)
        run: python3 adapters/sovereign_adapter_phase2.py

      - name: Run Makefile Test Suite
        run: make test
