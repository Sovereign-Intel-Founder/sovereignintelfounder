name: SIP Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pipeline-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential sqlite3 libsqlite3-dev

      - name: Compile Toll Bridge C Engine
        run: |
          gcc -O3 -Wall toll_bridge_server.c -o toll_bridge_server -lsqlite3 -lpthread
