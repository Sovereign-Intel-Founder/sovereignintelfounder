name: SIP Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pynacl pytest
        
    - name: Ensure Key Material Exists
      env:
        PYTHONPATH: .:sovereign-xdp-shield
      run: |
        python3 -c "
        from sip_remote_handoff.node_auth import SipHandoffNode
        node = SipHandoffNode()
        print('Node initialized successfully with ID:', node.node_id)
        "
        
    - name: Run Phase 1 Telemetry (Identity & Crypto)
      env:
        PYTHONPATH: .:sovereign-xdp-shield
      run: python3 adapters/sovereign_adapter_phase1.py
      
    - name: Run Phase 2 Telemetry (Residency & Sovereignty)
      env:
        PYTHONPATH: .:sovereign-xdp-shield
      run: python3 adapters/sovereign_adapter_phase2.py
      
    - name: Run Full Test Suite
      env:
        PYTHONPATH: .:sovereign-xdp-shield
      run: pytest -v
