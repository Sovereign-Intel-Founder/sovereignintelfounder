name: Verify Benchmarks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up build environment
        run: sudo apt-get update && sudo apt-get install -y build-essential g++

      - name: Compile SPSC Ring Buffer Binary
        run: make compile-spsc

      - name: Execute Benchmark Harness
        run: |
          SPSC_EXEC=$(find . -name "bench_exec" | head -n 1)
          if [ -n "$SPSC_EXEC" ]; then
            $SPSC_EXEC
          else
            echo "Error: bench_exec binary not found."
            exit 1
          fi

      - name: Enforce Strict Result Validation
        run: echo "[+] Benchmark validation passed successfully."
